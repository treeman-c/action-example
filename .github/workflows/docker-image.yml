name: Build and Push komari-argo image (GHCR)

# 触发方式：推送到 main 分支的 docker/ 目录变化时自动构建；
# 也支持手动触发 (workflow_dispatch)
on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch: {}
  schedule:
    # 可选：每周重新构建一次以跟随 komari / cloudflared 上游更新
    - cron: '0 18 * * 0'

env:
  # 镜像会推送到 ghcr.io/<你的GitHub用户名或组织名>/komari-argo
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/komari-argo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送到 GHCR 必须要有这个权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 直接用仓库自带的 GITHUB_TOKEN 登录，不需要额外创建任何 Secret
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
