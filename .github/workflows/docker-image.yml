name: Build and Push komari-argo image

# 触发方式：推送到 main 分支的 docker/ 目录变化时自动构建；
# 也支持手动触发 (workflow_dispatch)
on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch: {}
  schedule:
    # 可选：每周重新构建一次以跟随 komari / cloudflared 上游更新
    - cron: '0 18 * * 0'

env:
  # 按需修改为你自己的 Docker Hub 命名空间/镜像名
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/komari-argo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 如果你更想推送到 GitHub Container Registry，改用下面这段并把
      # IMAGE_NAME 换成 ghcr.io/<owner>/komari-argo，去掉 Docker Hub 登录步骤
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
